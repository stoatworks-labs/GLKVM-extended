name: release

on:
  push:
    tags:
    - 'v*'

jobs:
  docker:
    # Upstream-only: pushes to the upstream author's Docker Hub. Skip on forks.
    if: github.repository == 'zhaojh329/rttys'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: get-version
        uses: battila7/get-version-action@v2

      - uses: docker/login-action@v3
        with:
          username: zhaojh329
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            zhaojh329/rttys:${{ steps.get-version.outputs.version-without-v }}
            zhaojh329/rttys:latest

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: get-version
        uses: battila7/get-version-action@v2

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - name: Build ui and cross-compiled binaries
        run: |
          make ui
          make build-linux-amd64 build-linux-arm64

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rttys-linux-amd64
            dist/rttys-linux-arm64
          draft: true
